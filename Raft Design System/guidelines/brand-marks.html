<!-- @dsCard group="Brand" viewport="700x230" name="Logo marks" subtitle="Lime wordmark square and the animated R-mark" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--bg-canvas);padding:16px;font-family:var(--font-sans);min-height:220px}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:104px}.ch{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-rule)}.nm{font-size:11px;font-weight:900;letter-spacing:.52px;text-transform:uppercase;color:var(--text-primary);margin-top:6px}.hx{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}.lb{font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div style="display:flex;align-items:flex-end;gap:20px">
<div style="width:180px;height:180px;background:var(--lime);display:flex;align-items:center;justify-content:center"><div style="display:flex;flex-direction:column;align-items:center"><div style="font-size:52px;font-weight:900;letter-spacing:-.06em;line-height:.85;color:var(--dark)">RAFT</div><div style="font-size:52px;font-weight:900;letter-spacing:-.04em;line-height:.85;color:var(--white)">DESIGN</div></div></div>
<div style="display:flex;flex-direction:column;gap:6px"><img src="../assets/r-mark-dark.gif" width="80" height="80" alt="Raft R-mark, dark"><span class="hx">r-mark-dark.gif</span></div>
<div style="display:flex;flex-direction:column;gap:6px"><img src="../assets/r-mark-light.gif" width="80" height="80" alt="Raft R-mark, light"><span class="hx">r-mark-light.gif</span></div>
<div style="display:flex;flex-direction:column;gap:6px"><img src="../assets/r-mark-logo.svg" width="80" height="80" alt="Raft R-mark, static"><span class="hx">r-mark-logo.svg</span></div>
</div></body></html>

<!-- @dsCard group="Colors" viewport="700x150" name="Brand accent" subtitle="One acid-lime accent, constant across both themes" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--bg-canvas);padding:16px;font-family:var(--font-sans);min-height:118px}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:104px}.ch{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-rule)}.nm{font-size:11px;font-weight:900;letter-spacing:.52px;text-transform:uppercase;color:var(--text-primary);margin-top:6px}.hx{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}.lb{font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="g">
<div class="sw"><div class="ch" style="background:#3DE83D"></div><div class="nm">bg-brand</div><div class="hx">#3DE83D</div></div>
<div class="sw"><div class="ch" style="background:#0B1F14"></div><div class="nm">accent-ink</div><div class="hx">#0B1F14</div></div>
<div class="sw"><div class="ch" style="background:#3DE83D"></div><div class="nm">lime (mark)</div><div class="hx">#3DE83D</div></div>
<div class="sw"><div class="ch" style="background:#04220F"></div><div class="nm">dark (mark)</div><div class="hx">#04220F</div></div>
<div class="sw" style="width:250px"><div class="ch" style="background:#3DE83D;color:#0B1F14;display:flex;align-items:center;padding:0 14px;font-weight:900;font-size:13px;letter-spacing:.52px">ACCENT INK ON BRAND GREEN</div><div class="nm">In use</div><div class="hx">Section labels, filled buttons, hover</div></div>
</div></body></html>

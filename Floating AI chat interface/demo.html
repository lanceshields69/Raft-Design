<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Raft Assistant — component preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="raft-chat.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--bg-canvas); }
  body {
    font-family: var(--font-sans);
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    box-sizing: border-box;
  }
  .note { max-width: 480px; }
  .note p { color: var(--text-muted); font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="note">
    <p>Floating chat field + panel only — no site chrome here on purpose. Click the input at the bottom to try it.</p>
  </div>
  <div id="raft-chat-root"></div>
  <script src="raft-chat.js"></script>
  <script>
    new RaftChat(document.getElementById('raft-chat-root'), {
      assetsBase: './assets/',
      avatarSrc: './assets/r-mark-dark.gif'
    });
  </script>
</body>
</html>

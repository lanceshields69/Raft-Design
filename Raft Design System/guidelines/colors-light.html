<!-- @dsCard group="Colors" viewport="700x150" name="Light mode" subtitle="A full parallel palette, not an inverted filter" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--bg-canvas);padding:16px;font-family:var(--font-sans);min-height:118px}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:104px}.ch{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-rule)}.nm{font-size:11px;font-weight:900;letter-spacing:.52px;text-transform:uppercase;color:var(--text-primary);margin-top:6px}.hx{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}.lb{font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="g">
<div class="sw"><div class="ch" style="background:#F7FFF7"></div><div class="nm">bg-canvas</div><div class="hx">#F7FFF7</div></div>
<div class="sw"><div class="ch" style="background:#EBF7EB"></div><div class="nm">bg-surface</div><div class="hx">#EBF7EB</div></div>
<div class="sw"><div class="ch" style="background:#EAFFEA"></div><div class="nm">bg-sunken</div><div class="hx">#EAFFEA</div></div>
<div class="sw"><div class="ch" style="background:#159845"></div><div class="nm">text-accent</div><div class="hx">#159845</div></div>
<div class="sw"><div class="ch" style="background:#CFE5D7"></div><div class="nm">border-rule</div><div class="hx">#CFE5D7</div></div>
<div class="sw"><div class="ch" style="background:#000000"></div><div class="nm">text-primary</div><div class="hx">#000000</div></div>
</div></body></html>

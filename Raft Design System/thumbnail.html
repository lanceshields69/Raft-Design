<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0}body{width:1280px;height:854px;display:flex;overflow:hidden}
.main{flex:1;background:var(--lime);display:flex;align-items:center;justify-content:center}
.mark{display:flex;flex-direction:column;align-items:center;font-family:var(--font-sans);font-weight:900;text-transform:uppercase;line-height:.85}
.mark span:first-child{font-size:250px;letter-spacing:-.06em;color:var(--dark)}.mark span:last-child{font-size:250px;letter-spacing:-.04em;color:var(--white)}
.strip{width:200px;display:flex;flex-direction:column}.strip div{flex:1}</style></head>
<body><div class="main"><div class="mark"><span>Raft</span><span>Design</span></div></div>
<div class="strip"><div style="background:#AAA9FF"></div><div style="background:#FFAE00"></div><div style="background:#00C7BE"></div><div style="background:#04220F"></div></div>
</body></html>

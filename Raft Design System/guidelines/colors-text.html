<!-- @dsCard group="Colors" viewport="700x150" name="Text colors" subtitle="Off-white body, muted metadata, green links" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--bg-canvas);padding:16px;font-family:var(--font-sans);min-height:120px}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:104px}.ch{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-rule)}.nm{font-size:11px;font-weight:900;letter-spacing:.52px;text-transform:uppercase;color:var(--text-primary);margin-top:6px}.hx{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}.lb{font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div style="display:flex;flex-direction:column;gap:10px">
<p style="font-size:16px;color:var(--text-primary)">text-primary #EDF2EE — body copy, never pure white</p>
<p style="font-size:16px;color:var(--text-muted)">text-muted #8FA396 — labels, captions, metadata (constant across themes)</p>
<p style="font-size:16px;color:var(--text-accent)">text-accent #3DE83D — links and accent text (#159845 in light mode)</p>
<p style="font-size:16px;color:var(--color-error)">color-error #FF8A80 — form validation only; the one non-brand color</p>
</div></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Archive embed test — Raft Design</title>
  <style>
    html, body { height: 100%; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #fff; color: #fff; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    .archive-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      height: 43px; padding: 0 16px;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
      background: rgba(0, 0, 0, 0.7);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      font-size: 13px;
    }
    .archive-bar img { width: 24px; height: 24px; display: block; }
    .archive-bar a { display: inline-flex; align-items: center; gap: 8px; }
    .archive-bar img.archive-bar-icon { width: 16px; height: 16px; }
    .archive-bar-title { margin: 0; text-align: center; color: #fff; white-space: nowrap; }
    .archive-bar a { justify-self: end; color: #fff; font-size: 12px; text-decoration: none; opacity: 0.8; white-space: nowrap; }
    .archive-bar a:hover { opacity: 1; text-decoration: underline; }
    @media (max-width: 600px) { .archive-bar-title { font-size: 11px; } .archive-bar a { font-size: 11px; } }
  </style>
</head>
<body>
  <iframe src="https://web.archive.org/web/20240615170033if_/https://thatsnotcool.com/" title="Archived That's Not Cool website"></iframe>
  <div class="archive-bar">
    <img src="../images/r-mark-logo.svg" alt="Raft Design">
    <p class="archive-bar-title">Archived site: thatsnotcool.com</p>
    <a href="https://web.archive.org/web/20240615170033/https://thatsnotcool.com/" target="_blank" rel="noopener"><img class="archive-bar-icon" src="../images/wayback-machine.svg" alt="">View on the Wayback Machine →</a>
  </div>
</body>
</html>

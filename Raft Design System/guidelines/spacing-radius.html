<!-- @dsCard group="Spacing" viewport="700x150" name="Radius" subtitle="2px labels, 4px cards, pill buttons — plus raw 50% circles" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--bg-canvas);padding:16px;font-family:var(--font-sans);min-height:140px}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:104px}.ch{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-rule)}.nm{font-size:11px;font-weight:900;letter-spacing:.52px;text-transform:uppercase;color:var(--text-primary);margin-top:6px}.hx{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}.lb{font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="g" style="gap:16px;align-items:flex-start">
<div><div style="width:120px;height:64px;background:var(--bg-elevated);border:1px solid var(--border-rule);border-radius:2px"></div><div class="nm">radius-sm</div><div class="hx">2px — section labels, tags</div></div>
<div><div style="width:120px;height:64px;background:var(--bg-elevated);border:1px solid var(--border-rule);border-radius:4px"></div><div class="nm">radius-md</div><div class="hx">4px — cards, images, modals</div></div>
<div><div style="width:160px;height:64px;background:none;border:1px solid var(--border-button);border-radius:999px"></div><div class="nm">radius-pill</div><div class="hx">999px — buttons, badges</div></div>
<div><div style="width:64px;height:64px;background:var(--bg-brand);border-radius:50%"></div><div class="nm">50%</div><div class="hx">Dots, avatars</div></div>
</div></body></html>

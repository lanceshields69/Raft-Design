<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--bg-canvas);padding:16px;font-family:var(--font-sans);min-height:160px}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:104px}.ch{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-rule)}.nm{font-size:11px;font-weight:900;letter-spacing:.52px;text-transform:uppercase;color:var(--text-primary);margin-top:6px}.hx{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}.lb{font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div style="display:flex;flex-direction:column;gap:12px">
<p style="font-size:20px;line-height:28px;max-width:620px">Body large — 20px/28px. CTA labels and intro paragraphs.</p>
<p style="font-size:16px;line-height:24px;max-width:620px">Body medium — 16px/24px. The default measure for everything else: approach copy, card summaries, FAQ answers, article paragraphs. Corrected down from 20px against Figma, so long-form reads at 16px throughout.</p>

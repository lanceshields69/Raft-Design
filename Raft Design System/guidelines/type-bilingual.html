<!-- @dsCard group="Type" viewport="700x200" name="Bilingual EN / JA" subtitle="Noto Sans JP, tracking 0, looser line-height" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--bg-canvas);padding:16px;font-family:var(--font-sans);min-height:190px}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:104px}.ch{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-rule)}.nm{font-size:11px;font-weight:900;letter-spacing:.52px;text-transform:uppercase;color:var(--text-primary);margin-top:6px}.hx{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}.lb{font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div style="display:flex;flex-direction:column;gap:12px">
<p style="font-family:var(--font-logotype);font-size:28px;font-weight:900;letter-spacing:0;line-height:1.5">レイフト・デザイン — 見出しは letter-spacing: 0</p>
<p style="font-family:var(--font-sans-ja);font-size:16px;line-height:1.9;max-width:620px">日本語の本文は line-height 1.9。ラテン文字より一行あたりの密度が高いため、同じ読速を保つには縦の余白が必要です。word-break は既定値のまま、overflow-wrap: anywhere のみ安全網として追加します。</p>
<p class="lb">Headings 1.5 / body 1.9 / letter-spacing 0 / .emphasis swaps to Noto Serif JP 900</p>
</div></body></html>

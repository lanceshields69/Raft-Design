<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">

<div class="sw"><div class="ch" style="background:#04220F"></div><div class="nm">bg-canvas</div><div class="hx">#04220F</div></div>

<div class="sw"><div class="ch" style="background:#102A1B"></div><div class="nm">bg-elevated</div><div class="hx">#102A1B</div></div>
<div class="sw"><div class="ch" style="background:#02190A"></div><div class="nm">bg-sunken</div><div class="hx">#02190A</div></div>
<div class="sw"><div class="ch" style="background:#1E3A28"></div><div class="nm">border-rule</div><div class="hx">#1E3A28</div></div>
<div class="sw"><div class="ch" style="background:#438259"></div><div class="nm">border-bright</div><div class="hx">#438259</div></div>
</div></body></html>
